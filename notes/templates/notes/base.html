<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% block title %}
            Sticky Notes
        {% endblock %}
    </title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <header class="site-header">
        <div class="page-shell header-content">
            <a class="brand" href="{% url 'note_list' %}">Sticky Notes</a>
            <a class="button button-primary" href="{% url 'note_create' %}">Create New Note</a>
        </div>
    </header>

    <main class="page-shell">
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
