{% extends "notes/base.html" %}

{% block title %}
{{ note.title }}
{% endblock %}

{% block content %}

<article class="detail-card sticky-note">
    <p class="eyebrow">Note details</p>
    <h1>{{ note.title }}</h1>
    <p class="note-content">{{ note.content|linebreaksbr }}</p>
    <small>Created {{ note.created_at|date:"d M Y, H:i" }}</small>
</article>

<nav class="actions" aria-label="Note actions">
    <a class="button button-primary" href="{% url 'note_update' note.pk %}">Edit Note</a>
    <a class="button button-danger" href="{% url 'note_delete' note.pk %}">Delete Note</a>
    <a class="button button-secondary" href="{% url 'note_list' %}">Back to Notes</a>
</nav>

{% endblock %}
