{% extends "notes/base.html" %}

{% block title %}
Delete Note
{% endblock %}

{% block content %}

<section class="form-card delete-card">
    <p class="eyebrow">Confirmation required</p>
    <h1>Delete Note</h1>
    <p>Are you sure you want to delete <strong>{{ note.title }}</strong>?</p>
    <p class="warning-text">This action cannot be undone.</p>

    <form method="post">
        {% csrf_token %}
        <div class="actions">
            <button class="button button-danger" type="submit">Delete Note</button>
            <a class="button button-secondary" href="{% url 'note_detail' note.pk %}">Cancel</a>
        </div>
    </form>
</section>

{% endblock %}
