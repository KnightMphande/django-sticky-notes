{% extends "notes/base.html" %}

{% block title %}
Delete Note
{% endblock %}

{% block content %}

<h2>Delete Note</h2>

<p>
    Are you sure you want to delete
    <strong>{{ note.title }}</strong>?
</p>

<form method="POST">

    {% csrf_token %}

    <button type="submit">
        Delete
    </button>

</form>

<p>
    <a href="{% url 'note_list' %}">Cancel</a>
</p>

{% endblock %}
