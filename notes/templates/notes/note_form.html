{% extends "notes/base.html" %}

{% block title %}
Create / Edit Note
{% endblock %}

{% block content %}

<section class="form-card">
    <p class="eyebrow">Note editor</p>
    <h1>{% if object %}Edit Note{% else %}Create Note{% endif %}</h1>
    <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
        <div class="actions">
            <button class="button button-primary" type="submit">Save Note</button>
            <a class="button button-secondary" href="{% url 'note_list' %}">Cancel</a>
        </div>
    </form>
</section>

{% endblock %}
